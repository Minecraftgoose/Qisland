# Qisland 发行流水线

name: Qisland 安装包

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 0.3.4；留空则用 tag，再退回 src/version.h'
        required: false
        default: ''
      tag:
        description: 'Release tag；留空则用当前 tag 或 v<版本号>'
        required: false
        default: ''

permissions:
  contents: write          # gh release create / upload 需要

concurrency:
  group: qisland-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      INPUT_VERSION: ${{ github.event.inputs.version }}
      INPUT_TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: 取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python（仅用于同步版本号与写环境变量）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 官方源安装编译 / 打包工具链
      - name: 安装 MinGW-w64 GCC 与 NSIS（MSYS2 官方仓库）
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # MINGW64 已被 MSYS2 标记弃用； 本项目要兼容 Win7（msvcrt），暂不迁 UCRT64。
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nsis

      - name: 组装打包目录
        shell: bash
        run: |
          set -euo pipefail
          S="_release/Qisland"
          mkdir -p "$S/源码/src" "$S/源码/nsis" "$S/软件/Qisland/assets" \
                   "$S/软件/Qisland/LICENSES"
          cp -a src/. "$S/源码/src/"              # 含 qisland.manifest，windres 要读
          cp -a nsis/. "$S/源码/nsis/"

          cp "assets/fa-solid-900.ttf"      "$S/软件/Qisland/assets/"
          cp "assets/OPPO Sans 4.0.ttf"     "$S/软件/Qisland/assets/"
          cp "assets/notice.wav"            "$S/软件/Qisland/assets/"

          # 第三方许可全文按分发合规要求随包保留，但单独放 LICENSES\， 不混进 assets\（OPPO Sans 要求任何副本保留协议全文）。
          cp -r LICENSES/. "$S/软件/Qisland/LICENSES/"
          cp LICENSE "$S/软件/Qisland/LICENSE"   # 项目自身 Apache-2.0

          test -f "$S/源码/src/build.bat"
          test -f "$S/源码/src/qisland.manifest"
          test -f "$S/源码/src/qisland.ico"   # NSIS 的 MUI_ICON / MUI_UNICON 要读
          test -f "$S/源码/nsis/Qisland.nsi"
          test -f "$S/软件/Qisland/assets/fa-solid-900.ttf"
          test -f "$S/软件/Qisland/assets/OPPO Sans 4.0.ttf"
          test -f "$S/软件/Qisland/assets/notice.wav"
          for f in ATTRIBUTION.txt Apache-2.0.txt Font-Awesome-Free-License.txt \
                   MIT-lunar-javascript.txt NOTICE-lunar-calendar.txt \
                   OPPO-Sans-4.0-License-Notice.txt; do
            test -f "$S/软件/Qisland/LICENSES/$f"
          done
          test -f "$S/软件/Qisland/LICENSE"
          test ! -e "$S/软件/Qisland/preview.png"
          test ! -e "$S/软件/Qisland/README.md"

      # 版本：只改 runner 上的工作副本，不回写仓库
      - name: 解析版本并同步两处字面量
        shell: bash
        run: |
          python - <<'PY'
          import os, re

          S = "_release/Qisland"
          vh = os.path.join(S, "源码", "src", "version.h")
          nsi = os.path.join(S, "源码", "nsis", "Qisland.nsi")

          def parse(s):
              m = re.match(r"^[vV]?(\d+)\.(\d+)(?:\.(\d+))?(.*)$", (s or "").strip())
              if not m:
                  return None
              a, b = int(m.group(1)), int(m.group(2))
              c = int(m.group(3) or 0)
              ver = f"{a}.{b}" if m.group(3) is None else f"{a}.{b}.{c}"
              return ver, f"{a}.{b}.{c}.0", f"{a},{b},{c},0", bool(re.search(r"[-+]", m.group(4)))

          cur = re.search(r'QI_VERSION_STR\s+"([^"]+)"', open(vh, encoding="utf-8").read())
          current = cur.group(1) if cur else "0.3.4"
          ref = os.environ.get("GITHUB_REF", "")
          tag = os.environ.get("INPUT_TAG", "").strip() or (
              ref[len("refs/tags/"):] if ref.startswith("refs/tags/") else "")
          info = parse(os.environ.get("INPUT_VERSION", "").strip()) or parse(tag) or parse(current)
          ver, ver4, num4, pre = info
          release_tag = os.environ.get("INPUT_TAG", "").strip() or tag or ("v" + ver)

          nsi_s = open(nsi, encoding="utf-8-sig").read()
          if ver != current:
              s = open(vh, encoding="utf-8").read()
              s = re.sub(r'(#define\s+QI_VERSION_STR\s+)"[^"]*"', lambda m: m.group(1) + '"' + ver + '"', s)
              s = re.sub(r'(#define\s+QI_VERSION_NUM\s+)[0-9, \t]+', lambda m: m.group(1) + num4 + "      ", s)
              s = re.sub(r'(#define\s+QI_VERSION_W\s+)L"[^"]*"', lambda m: m.group(1) + 'L"' + ver + '"', s)
              open(vh, "w", encoding="utf-8", newline="").write(s)
              nsi_s = re.sub(r'(^\s*!define\s+APPVERSION\s+)"[^"]*"', lambda m: m.group(1) + '"' + ver + '"', nsi_s, flags=re.M)
              nsi_s = re.sub(r'(^\s*!define\s+APPVERSION4\s+)"[^"]*"', lambda m: m.group(1) + '"' + ver4 + '"', nsi_s, flags=re.M)
              print("版本同步为", ver, "(来自 tag/输入)")
          else:
              print("版本保持", ver)
          open(nsi, "w", encoding="utf-8-sig", newline="").write(nsi_s)
          assert open(nsi, "rb").read(3) == b"\xef\xbb\xbf", "Qisland.nsi 的 UTF-8 BOM 丢了"
          print("Qisland.nsi 已确认为 UTF8SIG")

          vals = {"VERSION": ver, "SETUP_NAME": f"Qisland-{ver}-Setup.exe",
                  "RELEASE_TAG": release_tag, "PRERELEASE": "true" if pre else "false"}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for k, v in vals.items():
                  f.write(f"{k}={v}\n")
          print(vals)
          PY

      # 编译：SRC / LIBS 仍以 build.bat 为唯一来源 不直接跑 build.bat（末尾有 pause，且 cmd 不展开 *.c）。
      - name: 编译 Qisland.exe
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "_release/Qisland/源码/src"
          command -v gcc && gcc --version | head -1
          command -v windres
          SRC="$(grep -i '^set SRC=' build.bat | sed 's/^set SRC=//' | tr -d '\r' | tr '\\' '/')"
          LIBS="$(grep -i '^set LIBS=' build.bat | sed 's/^set LIBS=//' | tr -d '\r')"
          test -n "$SRC" && test -n "$LIBS"
          echo "SRC=$SRC"
          windres qisland.rc -O coff -o qisland_res.o
          gcc -O2 -s -mwindows -municode -Wall -Wextra -Wno-unused-parameter \
              $SRC qisland_res.o -o Qisland.exe $LIBS
          test -s Qisland.exe
          cp Qisland.exe "../../软件/Qisland/Qisland.exe"
          ls -l "../../软件/Qisland/Qisland.exe"

      - name: 生成 NSIS 安装包
        shell: msys2 {0}
        run: |
          set -euo pipefail
          command -v makensis
          test -f /mingw64/share/nsis/Include/MUI2.nsh
          export MSYS2_ARG_CONV_EXCL='*'
          # NSISDIR 给的是 Windows 原生程序，禁止 MSYS2 再按 POSIX 路径列表转换
          export MSYS2_ENV_CONV_EXCL='NSISDIR'
          export NSISDIR="$(cygpath -w /mingw64/share/nsis)"
          cd "_release/Qisland/源码/nsis"
          makensis Qisland.nsi
          test -s "../../软件/$SETUP_NAME"
          ls -l "../../软件/$SETUP_NAME"
          # GITHUB_WORKSPACE 是 D:\... 形式，先转成 MSYS2 的 POSIX 路径再给 cp
          cp "../../软件/$SETUP_NAME" "$(cygpath -u "$GITHUB_WORKSPACE")/$SETUP_NAME"

      - name: 备份安装包
        uses: actions/upload-artifact@v4
        with:
          name: qisland-setup
          path: Qisland-*-Setup.exe
          if-no-files-found: error

      # 发布：Release 里只挂安装包一份资产
      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          SETUP="$SETUP_NAME"
          FLAG=""
          if [ "$PRERELEASE" = "true" ]; then FLAG="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SETUP" --clobber
          else
            gh release create "$TAG" "$SETUP" \
              --target "$GITHUB_SHA" \
              --title "Qisland $VERSION" \
              --generate-notes $FLAG
          fi
          gh release view "$TAG" --json tagName,assets --jq '.tagName, (.assets[].name)'
